name: Refresh profile activity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_activity.py'
      - '.github/workflows/activity.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Publish updated image
        run: |
          if git diff --quiet -- assets/activity.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg
          git commit -m 'Refresh profile activity'
          git pull --rebase
          git push
